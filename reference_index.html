                                    Sổ Thi Đua & Điểm Cộng Trừ
                                </h2>
                                <p className="text-sm text-slate-500 mt-1">Ghi nhận phát biểu, đóng góp xây dựng bài</p>
                            </div>
                            <Select value={selectedClass} onChange={e => setSelectedClass(e.target.value)} className="w-40">
                                {data.classes.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                            </Select>
                        </div>

                        <Card title="Bảng Tổng Hợp Điểm Thi Đua" icon="fa-solid fa-trophy">
                            {students.length === 0 ? (
                                <EmptyState message="Lớp này chưa có học sinh." icon="fa-users" />
                            ) : (
                                <div className="divide-y divide-slate-100">
                                    {students.map((student, idx) => {
                                        const score = getStudentScore(student.id);
                                        return (
                                            <div key={student.id} className="py-3 flex justify-between items-center">
                                                <div className="flex items-center gap-3">
                                                    <span className="w-7 h-7 rounded-lg bg-slate-100 text-slate-500 font-bold text-xs flex items-center justify-center">{idx + 1}</span>
                                                    <span className="font-bold text-slate-800">{student.name}</span>
                                                </div>
                                                <div className="flex items-center gap-3">
                                                    <span className={`font-black text-sm px-3 py-1 rounded-xl border ${score > 0 ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : score < 0 ? 'bg-rose-50 text-rose-700 border-rose-200' : 'bg-slate-100 text-slate-600 border-slate-200'}`}>
                                                        {score > 0 ? `+${score}` : score} điểm
                                                    </span>
                                                    <button onClick={() => handleAddPoint(student.id, 1)} className="w-8 h-8 rounded-xl bg-emerald-50 text-emerald-700 hover:bg-emerald-600 hover:text-white border border-emerald-200 font-bold text-sm transition-all">+</button>
                                                    <button onClick={() => handleAddPoint(student.id, -1)} className="w-8 h-8 rounded-xl bg-rose-50 text-rose-700 hover:bg-rose-600 hover:text-white border border-rose-200 font-bold text-sm transition-all">-</button>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            )}
                        </Card>
                    </div>
                );
            };

            // ============================================================
            // VIEW: NHIỆM VỤ & CÔNG VIỆC (TASKS)
            // ============================================================
            const TasksView = () => {
                const [newTaskTitle, setNewTaskTitle] = useState('');
                const [dueDate, setDueDate] = useState('');

                const handleAddTask = (e) => {
                    e.preventDefault();
                    if (!newTaskTitle.trim()) return;
                    const task = { id: generateId(), title: newTaskTitle.trim(), dueDate, completed: false };
                    updateData('tasks', [...data.tasks, task]);
                    setNewTaskTitle('');
                    showToast('Đã thêm nhiệm vụ!');
                };

                const handleToggleTask = (id) => {
                    updateData('tasks', data.tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t));
                };

                const handleDeleteTask = (id) => {
                    updateData('tasks', data.tasks.filter(t => t.id !== id));
                    showToast('Đã xóa nhiệm vụ');
                };

                return (
                    <div className="space-y-6 pb-24 md:pb-8 view-enter">
                        <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                            <h2 className="text-2xl font-black text-slate-800 flex items-center gap-3">
                                <i className="fa-solid fa-list-check text-indigo-600"></i>
                                Quản Lý Nhiệm Vụ & Kế Hoạch Cá Nhân
                            </h2>
                            <p className="text-sm text-slate-500 mt-1">Soạn giáo án, nộp đề kiểm tra, họp tổ chuyên môn...</p>
                        </div>

                        <Card title="Thêm Nhiệm Vụ Mới" icon="fa-solid fa-plus-circle">
                            <form onSubmit={handleAddTask} className="flex flex-col sm:flex-row gap-3 items-end">
                                <Input label="Tên công việc / nhiệm vụ" value={newTaskTitle} onChange={e => setNewTaskTitle(e.target.value)} placeholder="VD: Nộp đề thi giữa kỳ 1..." />
                                <Input label="Hạn chót" type="date" value={dueDate} onChange={e => setDueDate(e.target.value)} className="w-full sm:w-48" />
                                <Button type="submit" icon="fa-solid fa-plus" className="w-full sm:w-auto">Thêm</Button>
                            </form>
                        </Card>

                        <Card title={`Danh Sách Nhiệm Vụ (${data.tasks.filter(t => !t.completed).length} chưa hoàn thành)`} icon="fa-solid fa-tasks">
                            {data.tasks.length === 0 ? (
                                <EmptyState message="Chưa có nhiệm vụ nào. Thêm nhiệm vụ để không bị quên việc!" icon="fa-circle-check" />
                            ) : (
                                <div className="divide-y divide-slate-100">
                                    {data.tasks.map(task => (
                                        <div key={task.id} className="py-3 flex justify-between items-center">
                                            <div className="flex items-center gap-3">
                                                <input type="checkbox" checked={task.completed} onChange={() => handleToggleTask(task.id)} className="w-5 h-5 text-indigo-600 rounded focus:ring-indigo-500 cursor-pointer" />
                                                <div>
                                                    <span className={`font-bold text-sm ${task.completed ? 'line-through text-slate-400' : 'text-slate-800'}`}>{task.title}</span>
                                                    {task.dueDate && <span className="block text-xs text-slate-400">Hạn: {formatDate(task.dueDate)}</span>}
                                                </div>
                                            </div>
                                            <button onClick={() => handleDeleteTask(task.id)} className="text-slate-300 hover:text-rose-600 p-2"><i className="fa-solid fa-trash-can text-sm"></i></button>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </Card>
                    </div>
                );
            };

            // ============================================================
            // VIEW: CÀI ĐẶT HỆ THỐNG & SAO LƯU (SETTINGS)
            // ============================================================
            const SettingsView = () => {
                const [teacherForm, setTeacherForm] = useState(data.teacher);

                const handleSaveTeacher = (e) => {
                    e.preventDefault();
                    updateData('teacher', teacherForm);
                    if (teacherForm.schoolYearStart && data.curriculum.length > 0 && data.timetable.length > 0) {
                        const synced = recomputeAllCurriculumDates(data.curriculum, data.timetable, teacherForm.schoolYearStart);
                        updateData('curriculum', synced);
                    }
                    showToast('Đã lưu thông tin giáo viên & cập nhật ngày dự kiến! ✅');
                };

                const handleExportJSON = () => {
                    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `Du_Lieu_Bo_Mon_${data.teacher.schoolYear}_${getToday()}.json`;
                    a.click();
                    showToast('Đã tải về tệp sao lưu JSON!');
                };

                const handleImportJSON = (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        try {
                            const imported = JSON.parse(ev.target.result);
                            setData({ ...buildInitialData(), ...imported });
                            showToast('Khôi phục dữ liệu thành công! ✅');
                        } catch (err) {
                            showToast('Tệp JSON không hợp lệ!', 'error');
                        }
                    };
                    reader.readAsText(file);
                };

                const handleResetAll = () => {
                    confirmAction('CẢNH BÁO: Bạn có chắc chắn muốn nạp lại toàn bộ dữ liệu mẫu chuẩn (105 tiết CK + 35 CĐ)?', () => {
                        localStorage.removeItem(STORAGE_KEY);
                        setData(buildInitialData());
                        showToast('Đã khôi phục dữ liệu chuẩn! ✅');
                    });
                };

                return (
                    <div className="space-y-6 pb-24 md:pb-8 view-enter">
                        <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                            <h2 className="text-2xl font-black text-slate-800 flex items-center gap-3">
                                <i className="fa-solid fa-gear text-indigo-600"></i>
                                Cài Đặt Hệ Thống & Sao Lưu
                            </h2>
                            <p className="text-sm text-slate-500 mt-1">Cấu hình năm học, thông tin giáo viên và sao lưu an toàn</p>
                        </div>

                        <Card title="Thông Tin Giáo Viên & Năm Học" icon="fa-solid fa-user-tie">
                            <form onSubmit={handleSaveTeacher} className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <Input label="Họ và tên giáo viên" value={teacherForm.name} onChange={e => setTeacherForm({ ...teacherForm, name: e.target.value })} />
                                <Input label="Môn giảng dạy" value={teacherForm.subject} onChange={e => setTeacherForm({ ...teacherForm, subject: e.target.value })} />
                                <Input label="Năm học" value={teacherForm.schoolYear} onChange={e => setTeacherForm({ ...teacherForm, schoolYear: e.target.value })} />
                                <Input label="Ngày Bắt Đầu Năm Học (Thứ 2 Tuần 1)" type="date" value={teacherForm.schoolYearStart} onChange={e => setTeacherForm({ ...teacherForm, schoolYearStart: e.target.value })} hint="Rất quan trọng: để tự động tính ngày dự kiến cho từng tiết" />
                                <div className="sm:col-span-2">
                                    <Button type="submit" icon="fa-solid fa-floppy-disk">Lưu Thông Tin</Button>
                                </div>
                            </form>
                        </Card>

                        <Card title="Sao Lưu & Khôi Phục Dữ Liệu" icon="fa-solid fa-cloud-arrow-down">
                            <div className="flex flex-wrap gap-4 items-center">
                                <Button onClick={handleExportJSON} icon="fa-solid fa-download" variant="secondary">Xuất File Sao Lưu (.JSON)</Button>
                                <label className="inline-flex items-center justify-center font-bold text-sm px-4 py-2.5 rounded-xl bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 cursor-pointer shadow-sm">
                                    <i className="fa-solid fa-upload mr-2"></i> Nhập File Sao Lưu (.JSON)
                                    <input type="file" accept=".json" onChange={handleImportJSON} className="hidden" />
                                </label>
                                <Button onClick={handleResetAll} icon="fa-solid fa-wand-magic-sparkles" variant="amber">Khôi Phục Dữ Liệu Chuẩn Mẫu</Button>
                            </div>
                        </Card>
                    </div>
                );
            };

            // ============================================================
            // 5. RENDER APP SHELL (SIDEBAR BÊN TRÁI)
            // ============================================================
            const activeNavItem = navItems.find(item => item.id === currentView) || navItems[0];

            return (
                <div className="min-h-screen bg-slate-50 flex flex-col md:flex-row">
                    {/* Mobile Backdrop Overlay */}
                    {sidebarOpen && (
                        <div 
                            className="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-40 md:hidden transition-opacity"
                            onClick={() => setSidebarOpen(false)}
                        ></div>
                    )}

                    {/* SIDEBAR BÊN TRÁI (Desktop cố định + Mobile Drawer trượt từ trái) */}
                    <aside className={`fixed inset-y-0 left-0 z-50 w-64 bg-white border-r border-slate-200 flex flex-col transition-transform duration-300 ease-in-out no-print ${sidebarOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'}`}>
                        {/* Sidebar Header / Logo */}
                        <div className="h-16 flex items-center justify-between px-5 border-b border-slate-100 flex-shrink-0">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-indigo-600 to-indigo-700 text-white flex items-center justify-center font-black text-lg shadow-md shadow-indigo-200">
                                    <i className="fa-solid fa-graduation-cap"></i>
                                </div>
                                <div>
                                    <span className="font-black text-slate-800 text-base tracking-tight">Sổ Quản Lý <span className="text-indigo-600">PRO</span></span>
                                    <div className="text-[11px] font-bold text-slate-400">NH {data.teacher.schoolYear}</div>
                                </div>
                            </div>
                            <button 
                                className="md:hidden w-8 h-8 rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-100 flex items-center justify-center"
                                onClick={() => setSidebarOpen(false)}
                            >
                                <i className="fa-solid fa-xmark text-lg"></i>
                            </button>
                        </div>

                        {/* Navigation Items (Vertical List) */}
                        <nav className="flex-1 px-3 py-4 space-y-1.5 overflow-y-auto custom-scroll">
                            {navItems.map(item => {
                                const active = currentView === item.id;
                                return (
                                    <button
                                        key={item.id}
                                        onClick={() => {
                                            setCurrentView(item.id);
                                            setSidebarOpen(false);
                                        }}
                                        className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-bold transition-all text-left ${active ? 'bg-indigo-600 text-white shadow-md shadow-indigo-100' : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900'} ${item.highlight && !active ? 'text-indigo-600 bg-indigo-50/70 font-extrabold' : ''}`}
                                    >
                                        <i className={`${item.icon} w-5 text-center text-sm ${active ? 'text-white' : item.highlight ? 'text-indigo-600' : 'text-slate-400'}`}></i>
                                        <span className="flex-1 truncate">{item.label}</span>
                                        {item.highlight && !active && (
                                            <span className="w-2 h-2 rounded-full bg-indigo-600"></span>
                                        )}
                                    </button>
                                );
                            })}
                        </nav>

                        {/* Sidebar Footer / Teacher Profile */}
                        <div className="p-3 border-t border-slate-100 bg-slate-50/70 flex-shrink-0">
                            <div className="flex items-center gap-3 p-2 rounded-xl bg-white border border-slate-200/80 shadow-xs">
                                <div className="w-9 h-9 rounded-xl bg-indigo-600 text-white font-bold flex items-center justify-center text-sm shadow-xs">
                                    {data.teacher.name ? data.teacher.name.charAt(0) : 'T'}
                                </div>
                                <div className="flex-1 min-w-0">
                                    <div className="font-bold text-xs text-slate-800 truncate">{data.teacher.name || 'Giáo viên'}</div>
                                    <div className="text-[11px] text-indigo-600 font-semibold truncate">{data.teacher.subject} · Tuần {currentWeek}</div>
                                </div>
                            </div>
                        </div>
                    </aside>

                    {/* MAIN CONTENT AREA */}
                    <div className="flex-1 flex flex-col min-w-0 md:pl-64 min-h-screen">
                        {/* Top Bar for Desktop & Mobile */}
                        <header className="bg-white border-b border-slate-200 sticky top-0 z-30 h-16 flex items-center justify-between px-4 sm:px-6 lg:px-8 no-print">
                            <div className="flex items-center gap-3">
                                <button
                                    onClick={() => setSidebarOpen(true)}
                                    className="md:hidden p-2 rounded-xl text-slate-600 hover:bg-slate-100 border border-slate-200 flex items-center justify-center"
                                >
                                    <i className="fa-solid fa-bars text-lg"></i>
                                </button>
                                <div>
                                    <h1 className="text-base sm:text-lg font-extrabold text-slate-800 flex items-center gap-2">
                                        <i className={`${activeNavItem.icon} text-indigo-600 text-base`}></i>
                                        {activeNavItem.label}
                                    </h1>
                                </div>
                            </div>

                            <div className="flex items-center gap-2 sm:gap-3">
                                <div className="hidden sm:inline-flex items-center gap-2 px-3 py-1 bg-indigo-50 border border-indigo-100 rounded-xl text-xs font-bold text-indigo-700">
                                    <i className="fa-solid fa-calendar-check"></i>
                                    Tuần {currentWeek}
                                </div>
                                <div className="text-right hidden lg:block">
                                    <div className="font-bold text-xs text-slate-800">{data.teacher.name}</div>
                                    <div className="text-[11px] text-slate-500">{data.teacher.school}</div>
                                </div>
                            </div>
                        </header>

                        {/* View Content */}
                        <main className="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
                            {currentView === 'dashboard' && <DashboardView />}
                            {currentView === 'journal' && <JournalView />}
                            {currentView === 'timetable' && <TimetableView />}
                            {currentView === 'curriculum' && <CurriculumView />}
                            {currentView === 'students' && <StudentsView />}
                            {currentView === 'attendance' && <AttendanceView />}
                            {currentView === 'bonus' && <BonusPointsView />}
                            {currentView === 'tasks' && <TasksView />}
                            {currentView === 'settings' && <SettingsView />}
                        </main>
                    </div>

                    {/* Toast Notification */}
                    {toast && (
                        <div className="fixed bottom-6 right-6 z-50 animate-bounce">
                            <div className={`px-4 py-3 rounded-2xl shadow-xl border flex items-center gap-3 text-sm font-bold ${toast.type === 'error' ? 'bg-rose-600 text-white border-rose-500' : 'bg-slate-900 text-white border-slate-800'}`}>
                                <i className={`fa-solid ${toast.type === 'error' ? 'fa-triangle-exclamation' : 'fa-circle-check text-emerald-400'}`}></i>
                                <span>{toast.message}</span>
                            </div>
                        </div>
                    )}

                    {/* Confirmation Dialog */}
                    {confirmDialog && (
                        <Modal isOpen={true} onClose={() => setConfirmDialog(null)} title="Xác nhận thao tác">
                            <div className="space-y-4">
                                <p className="text-sm font-medium text-slate-700">{confirmDialog.message}</p>
                                <div className="flex gap-3 justify-end">
                                    <Button variant="secondary" onClick={() => setConfirmDialog(null)}>Hủy</Button>
                                    <Button variant="danger" onClick={() => { confirmDialog.onConfirm(); setConfirmDialog(null); }}>Đồng ý</Button>
                                </div>
                            </div>
                        </Modal>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

    </script>
</body>
</html>
